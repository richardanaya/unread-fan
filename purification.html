<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The purification basin</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/purification.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The purification basin</h1>
  <p>East, on the stone path, is the <a href="shrine-hall.html?from=west">shrine hall</a>. West, north, and south do not leave.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">East along the path is the shrine hall. North, west, and south stay in this court.</p>
<script>
window.ROOM = {
  still: [],
  depth: 0.78,
  x: 400,
  faceLeft: true,
  foot0: 300,
  foot1: 468,
  xMin: function (d) {
    var y = 300 + d * 168;
    return y < 392 ? 524 : 20;
  },
  xMax: function (d) {
    var y = 300 + d * 168;
    if (y < 392) return 650 + (y - 292) * 1.3;
    return Math.min(830, 780 + (y - 392) * 0.7);
  },
  west: null,
  east: "shrine-hall.html",
  north: null,
  south: null
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
