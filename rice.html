<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The rice fields</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/rice.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The rice fields</h1>
  <p>West is the <a href="farm.html?from=east">farm</a>. East is the <a href="forest.html?from=west">cedar forest</a>. North is the <a href="copse.html?from=south">copse</a>. South is the <a href="mill.html?from=north">mill</a>.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">West along the causeway is the farm, east is the cedar forest, north is the copse, and south is the mill. Water is not the floor.</p>
<script>
// Dirt causeway only. The cross opens to both side edges; the spine runs to the far copse and the near mill.
function riceBand(d) {
  const y = 204 + d * (468 - 204);
  const rows = [
    [204, 388, 466],
    [212, 348, 474],
    [220, 270, 584],
    [236, 244, 606],
    [248, 358, 500],
    [264, 360, 490],
    [272, 0, 852],
    [336, 0, 852],
    [348, 324, 530],
    [400, 320, 530],
    [468, 294, 548],
  ];
  let i = 1;
  while (i < rows.length && y > rows[i][0]) i++;
  if (i >= rows.length) i = rows.length - 1;
  const a = rows[i - 1];
  const b = rows[i];
  const t = (y - a[0]) / (b[0] - a[0]);
  return [a[1] + t * (b[1] - a[1]), a[2] + t * (b[2] - a[2])];
}
window.ROOM = {
  still: [],
  depth: 0.55,
  x: 360,
  faceLeft: false,
  foot0: 204,
  foot1: 468,
  xMin: function (d) { return riceBand(d)[0]; },
  xMax: function (d) { return riceBand(d)[1]; },
  west: "farm.html",
  east: "forest.html",
  north: "copse.html",
  south: "mill.html",
};
</script>
<script src="assets/heian/music.js"></script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
