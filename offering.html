<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The offering room</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/offering.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }

<body>
<header>
  <h1>The offering room</h1>
  <p>West, through the door, is the <a href="shrine-hall.html?from=east">shrine hall</a>. East, north, and south do not open.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">The tables and stands are part of the room. No one is here. West is the door back to the shrine hall. North is the far wall. South is the near edge of the boards.</p>
<script>
window.ROOM = {
  still: [],
  depth: 0.55,
  x: 360,
  faceLeft: true,
  // Open boards in front of the tables and stands, down to the near floor.
  foot0: 348,
  foot1: 468,
  xMin: function (d) { return 110 - d * 90; },
  xMax: function (d) { return 700 + d * 120; },
  west: "shrine-hall.html",
  east: null,
  north: null,
  south: null,
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
