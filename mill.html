  <h1>The mill</h1>
  <p>North, at the far edge, is the <a href="rice.html?from=south">rice fields</a>.</p>

<p class="note">Yoshi stands at the mill and looks west. North along the dirt, at the far edge, is the rice fields. The wheel and the stream stay beside the path. South is the near edge and does not leave. He looks west, back along the path to the fields.</p>
<script>
window.ROOM = {

  depth: 0.62,
  x: 400,
  faceLeft: true,
  foot0: 204,
  foot1: 468,
  // Dirt only. Far end is a narrow throat; the near end widens but stays off the stream and the grass.

  xMax: function (d) { return 508 + d * 192; },
  west: null,
  east: null,
