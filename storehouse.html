    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;

<body>
<header>
  <h1>The storehouse</h1>
  <p>West, through the door, is the <a href="hall.html?from=east">hall</a>. East is the <a href="kitchen.html?from=west">kitchen</a>. North and south do not open.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">No one waits here. A tachi lies on the near boards. West is the red door back to the hall. East is the kitchen. North is the chest wall. South is the near edge of the floor.</p>
<script>
window.ROOM = {
  still: [
    ["items/tachi", 500, 72, 36, false],
  ],
  depth: 0.6,
  x: 420,
  faceLeft: true,
  // Boards in front of the chests, down to the near floor. Not the side walls.
  foot0: 332,
  foot1: 466,
  xMin: function (d) { return 270 - d * 220; },
  xMax: function (d) { return 640 + d * 140; },
  west: "hall.html",
  east: "kitchen.html",
  north: null,
  south: null,
};
</script>
