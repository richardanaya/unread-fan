<title>The fishing shore</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }

  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;

    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }

<body>
<header>
  <h1>The fishing shore</h1>
  <p>North, along the sand, is the <a href="marsh.html?from=south">marsh</a>. East is the <a href="dunes.html?from=west">dunes</a>. West is the <a href="boatshed.html?from=east">boatshed</a>.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">Iso stands on the sand and looks east. North is the marsh. East is the dunes. West is the boatshed. The sea is only the far background, and south does not leave. He looks east, along the sand.</p>
<script>
window.ROOM = {
  still: [["characters/iso", 340, 150, 32, false]],
  depth: 0.55,
  x: 500,
  faceLeft: false,
  foot0: 228,
  foot1: 468,
  // Far path is narrow. Past it, the jetty blocks the left sand until the near beach.
  xMin: function (d) {
    if (d < 0.04) return 295;
    if (d < 0.66) return 355;
    return 16;
  },
  xMax: function (d) {
    if (d < 0.07) return 548;
    if (d < 0.11) return 680;
    return 844;
  },
  west: "boatshed.html",
  east: "dunes.html",
  north: "marsh.html",
  south: null,
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
