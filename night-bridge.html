<header>

  <p>East is the <a href="moon-deck.html?from=west">moon deck</a>. North is the <a href="bamboo.html?from=south">bamboo path</a>. The rail stops the west. The water is below the planks.</p>

<p class="note">East along the near planks is the moon deck. North, the boards meet the bamboo. There is no way west or south. He looks east, toward the palace.</p>
