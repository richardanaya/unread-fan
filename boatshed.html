<body>
<header>
  <h1>The boatshed</h1>
  <p>East, along the sand, is the <a href="shore.html?from=west">fishing shore</a>. North is the <a href="nets.html?from=south">drying nets</a>.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">Fune stands by the shed and looks east. East sand returns to the fishing shore. North sand goes to the drying nets. The boat stays inside the shed, off the path. He looks east, toward the shore.</p>
<script>
window.ROOM = {
  still: [["characters/fune", 300, 150, 40, false]],
  depth: 0.62,
  x: 620,
  faceLeft: true,
  foot0: 232,
  foot1: 456,
  // Far feet stay on the sand lane east of the shed. Near feet cross the open yard.
  xMin: function (d) {
    if (d >= 0.5) return 16;
    if (d < 0.32) return 500;
    if (d < 0.4) return 500 - (d - 0.32) * ((500 - 428) / 0.08);
    if (d < 0.46) return 428;
    return 428 - (d - 0.46) * ((428 - 16) / 0.04);
  },
  xMax: function () { return 852; },
  west: null,
  east: "shore.html",
  north: "nets.html",
  south: null,
};
</script>
