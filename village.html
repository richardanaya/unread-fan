<body>
<header>
  <h1>The village</h1>
  <p>South is the <a href="landing-west.html?from=north">far landing</a>. West, east, and north stop at the houses.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">South is the far landing. West, east, and north have no exit. He looks west, down the street.</p>
<script>
window.ROOM = {
  still: [
    ["characters/mura", 400, 150, 44, true],
  ],
  depth: 0.5,
  x: 390,
  faceLeft: false,
  foot0: 286,
  foot1: 468,
  // Dirt street, narrow at the far houses and wide at the near edge.
  xMin: function (d) {
    var y = 286 + d * 182;
    return -1.695 * y + 837;
  },
  xMax: function (d) {
    var y = 286 + d * 182;
    return 1.694 * y + 14;
  },
  west: null,
  east: null,
  north: null,
  south: "landing-west.html",
};
</script>
