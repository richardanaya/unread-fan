<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The bridge</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/bridge.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The bridge</h1>
  <p>West is the <a href="market.html?from=east">market</a>. The planks stop over the water.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">No one else is here. West along the deck is the market. The boards end at mid-bridge, and the water is below them, so there is no way east, north, or south.</p>
<script>
window.ROOM = {
  still: [],
  depth: 0.45,
  x: 180,
  faceLeft: false,
  foot0: 276,
  foot1: 366,
  // The deck touches the west edge. Its broken end is the right limit.
  xMin: function () { return 0; },
  xMax: function (d) { return 474 + d * 53; },
  west: "market.html",
  east: null,
  north: null,
  south: null,
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
