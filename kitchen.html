<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The kitchen</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/kitchen.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The kitchen</h1>
  <p>West is the <a href="storehouse.html?from=east">storehouse</a>. North is the <a href="well.html?from=south">well yard</a>. South is the <a href="wash.html?from=north">wash yard</a>. East is the stoves.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">West is the storehouse door. North is the far door to the well yard. South is the near edge, out to the wash yard. She looks east, toward the stoves.</p>
<script>
window.ROOM = {
  still: [
    ["characters/nabe", 300, 150, 44, false],
  ],
  depth: 0.55,
  x: 390,
  faceLeft: false,
  foot0: 330,
  foot1: 470,
  xMin: function (d) {
    if (d < 0.15) return 268;
    if (d < 0.55) return 268 - (d - 0.15) * 400;
    return 108 + (d - 0.55) * 70;
  },
  xMax: function (d) {
    if (d < 0.55) return 560 + d * (180 / 0.55);
    if (d < 0.75) return 740 + (d - 0.55) * (112 / 0.2);
    return 852;
  },
  west: "storehouse.html",
  east: null,
  north: "well.html",
  south: "wash.html",
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
