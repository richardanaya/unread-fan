<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The well yard</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/well.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The well yard</h1>
  <p>South, through the door, is the <a href="kitchen.html?from=north">kitchen</a>. West, east, and north do not open.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">South is the kitchen door. West, east, and north do not open.</p>
<script>
window.ROOM = {
  still: [],
  depth: 0.55,
  x: 400,
  faceLeft: true,
  // Dirt in front of the brick wall, down onto the stone at the door.
  foot0: 248,
  foot1: 468,
  // Stay right of the well until the feet clear its base, then the yard opens and pinches into the door.
  xMin: function (d) {
    if (d < 0.4) return 380;
    if (d < 0.72) return 24;
    return 24 + ((d - 0.72) / 0.28) * (373 - 24);
  },
  xMax: function (d) {
    if (d < 0.4) return 800;
    if (d < 0.72) return 828;
    return 828 + ((d - 0.72) / 0.28) * (505 - 828);
  },
  west: null,
  east: null,
  north: null,
  south: "kitchen.html",
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
