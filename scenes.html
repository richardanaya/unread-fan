<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All scenes</title>
<style>
  body { margin: 0; background: #10140c; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-weight: normal; font-size: 1.7rem; margin: 0 0 8px; }
  h2 { font-weight: normal; margin: 22px 0 8px; font-size: 1.15rem; }
  p, a { color: #e7f0d4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  a.card { color: inherit; text-decoration: none; }
  figure { margin: 0; }
  img { width: 100%; height: auto; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  figcaption { font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>All scenes</h1>
  <p>Every room, small. Click one to walk it. The cast is on <a href="assets.html">assets.html</a>.</p>
</header>
<main id="board"></main>
<script>
const groups = [
  ["The road", [
    ["rice.html", "rice.png", "Rice fields"],
    ["farm.html", "farm.png", "Farmhouse"],
    ["mill.html", "mill.png", "Mill"],
    ["copse.html", "copse.png", "Copse"],
    ["forest.html", "forest.png", "Cedar path"],
    ["shrine.html", "shrine.png", "Shrine path"],
    ["index.html", "courtyard.png", "Courtyard"],
  ]],
  ["The ridge", [
    ["steps.html", "steps.png", "Stone steps"],
    ["peak.html", "peak.png", "Peak shrine"],
    ["cave.html", "cave.png", "Hermit cave"],
    ["cliff.html", "cliff.png", "Cliff path"],
  ]],
  ["The shrine", [
    ["shrine-hall.html", "shrine-hall.png", "Shrine hall"],
    ["purification.html", "purification.png", "Purification"],
    ["offering.html", "offering.png", "Offering room"],
    ["bell.html", "bell.png", "Bell"],
  ]],
  ["The palace", [
    ["engawa.html", "engawa.png", "Engawa"],
    ["hall.html", "hall.png", "Great hall"],
    ["ladies.html", "ladies.png", "Ladies' rooms"],
    ["court-garden.html", "court-garden.png", "Ladies' garden"],
    ["sewing.html", "sewing.png", "Sewing room"],
    ["storehouse.html", "storehouse.png", "Storehouse"],
    ["kitchen.html", "kitchen.png", "Kitchen"],
    ["well.html", "well.png", "Well yard"],
    ["wash.html", "wash.png", "Wash yard"],
    ["inner-garden.html", "inner-garden.png", "Inner garden"],
    ["east-wall.html", "east-wall.png", "East wall"],
    ["moon-deck.html", "moon-deck.png", "Moon deck"],
    ["night-bridge.html", "night-bridge.png", "Night bridge"],
    ["bamboo.html", "bamboo.png", "Bamboo"],
  ]],
  ["Town and coast", [
    ["market.html", "market.png", "Market"],
    ["bridge.html", "bridge.png", "Bridge"],
    ["river.html", "river.png", "Riverbank"],
    ["dyer.html", "dyer.png", "Dyer's lane"],
    ["indigo.html", "indigo.png", "Indigo vats"],
    ["drying.html", "drying.png", "Drying yard"],
    ["ferry.html", "ferry.png", "Ferry"],
    ["marsh.html", "marsh.png", "Reed marsh"],
    ["shore.html", "shore.png", "Fishing shore"],
    ["dunes.html", "dunes.png", "Dunes"],
    ["salt.html", "salt.png", "Salt pans"],
    ["boatshed.html", "boatshed.png", "Boatshed"],
    ["nets.html", "nets.png", "Nets"],
    ["landing-west.html", "landing-west.png", "Far landing"],
    ["village.html", "village.png", "Village"],
  ]],
];
const board = document.getElementById("board");
for (const [heading, rooms] of groups) {
  const h = document.createElement("h2");
  h.textContent = heading;
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const [page, file, label] of rooms) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = page;
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = "assets/heian/scene/" + file;
    img.alt = label;
    const cap = document.createElement("figcaption");
    cap.textContent = label;
    fig.append(img, cap);
    a.append(fig);
    grid.append(a);
  }
  board.append(h, grid);
}
</script>
</body>
</html>
