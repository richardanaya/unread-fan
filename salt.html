<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The salt pans</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/salt.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The salt pans</h1>
  <p>West, along the sand, is the <a href="dunes.html?from=east">dunes</a>. North, east, and south do not leave.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">West is the dunes. The pans stay beside the track. North, east, and south do not leave. She looks west, toward the dunes.</p>
<script>
window.ROOM = {
  still: [["characters/shio", 300, 150, 40, true]],
  depth: 0.55,
  x: 180,
  faceLeft: true,
  foot0: 252,
  foot1: 468,
  xMin: function () { return 0; },
  xMax: function (d) {
    if (d < 0.16) return 300;
    if (d < 0.28) return 480;
    if (d < 0.55) return 480 + (d - 0.28) * 740;
    if (d < 0.75) return 700 + (d - 0.55) * 700;
    return 844;
  },
  west: "dunes.html",
  east: null,
  north: null,
  south: null,
};
</script>
<script src="assets/heian/music.js"></script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
