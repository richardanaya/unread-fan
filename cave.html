<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/heian/screen.css">
<meta charset="utf-8">
<title>The hermit cave</title>
<style>
  body { margin: 0; background: #0c0e0a; color: #e7f0d4; font: 16px/1.45 Georgia, serif; }
  header { max-width: 852px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 0 6px; }
  a { color: #e7f0d4; }
  .stage {
    position: relative; width: 852px; height: 480px; margin: 12px auto 28px;
    background: url("assets/heian/scene/cave.png") 0 0 / 852px 480px no-repeat;
    image-rendering: pixelated; overflow: hidden;
  }
  .sprite { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; width: auto; pointer-events: none; }
  p.note { max-width: 852px; margin: 0 auto 32px; padding: 0 16px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: #c5d2b0; }
</style>
</head>
<body>
<header>
  <h1>The hermit cave</h1>
  <p>East is the <a href="steps.html?from=west">steps</a>. North, south, and west are closed stone.</p>
</header>
<div class="stage" id="stage"></div>
<p class="note">No one is here. Enkei is at the peak, not in this cave. The floor is rock, and the pool stays on the near left. East, where the steps meet the opening, is the way out.</p>
<script>
window.ROOM = {
  still: [],
  depth: 0.7,
  x: 380,
  faceLeft: false,
  foot0: 312,
  foot1: 468,
  // The pool cuts the near left. Far rock runs to the left wall.
  xMin: function (d) { return (d > 0.38 && d < 0.92) ? 220 : 16; },
  // The right wall holds until the stone steps reach the east edge.
  xMax: function (d) { return d < 0.58 ? 800 : 852; },
  eastMinDepth: 0.58,
  west: null,
  east: "steps.html",
  north: null,
  south: null,
};
</script>
<script src="assets/heian/play.js"></script>
<script src="assets/heian/walk.js"></script>
</body>
</html>
